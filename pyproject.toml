[project]
name = "tcc-soccer-highlights"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "av>=18.1.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "opencv-python-headless>=5.0.0.93",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "openpyxl>=3.1.5",
    "plotly>=6.0.0",
    "seaborn>=0.13.2",
    "soccernet>=0.1.62",
    "huggingface-hub>=0.34.0",
    "requests>=2.32.0",
    "transnetv2-pytorch>=1.0.5",
    "ultralytics>=8.4.123",
    "streamlit>=1.44.0",
    "torch==2.11.0+cu126",
    "torchvision==0.26.0+cu126",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[project.scripts]
tcc-soccer-highlights = "tcc_soccer_highlights:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
